# Angzarr Server Configuration Example
# Copy to config.yaml and customize for your environment
#
# Environment variable overrides: ANGZARR_<SECTION>__<KEY>
# Example: ANGZARR_SERVER__HOST=0.0.0.0

# =============================================================================
# Storage Configuration
# =============================================================================
# Backends are defined once in a named registry; each storage role (events /
# snapshots / positions) references a registry entry by name. One backend can
# serve several roles, or different backends can serve different roles.
storage:
  backends:
    local:
      type: sqlite
      path: ./data/events.db   # omit `path` for in-memory SQLite
  events:
    use: local
  snapshots:
    use: local
  positions:
    use: local

  # PostgreSQL (production) — events + snapshots + positions on one backend:
  # backends:
  #   primary:
  #     type: postgres
  #     uri: postgres://localhost:5432/angzarr
  # events:    { use: primary }
  # snapshots: { use: primary }
  # positions: { use: primary }

  # Mixed roles — append-only event ledger (ImmuDB) with a separate mutable
  # editions store, Redis snapshots, and SQL position checkpoints:
  # backends:
  #   ledger:    { type: immudb, uri: postgresql://immudb:immudb@localhost:5432/defaultdb }
  #   branches:  { type: postgres, uri: postgres://localhost:5432/angzarr }
  #   events:    { type: composite, main: ledger, editions: branches }
  #   cache:     { type: redis, uri: redis://localhost:6379 }
  # events:    { use: events }
  # snapshots: { use: cache }
  # positions: { use: branches }

# =============================================================================
# Transport Configuration
# =============================================================================
transport:
  type: tcp  # "tcp" for network, "uds" for local IPC
  tcp:
    host: 0.0.0.0
    port: 50051
  # Unix domain sockets (standalone mode):
  # type: uds
  # uds:
  #   base_path: /tmp/angzarr

# =============================================================================
# Server Configuration (legacy - prefer transport section)
# =============================================================================
server:
  ch_port: 1313
  event_query_port: 1314
  host: 0.0.0.0

# =============================================================================
# Messaging Configuration
# =============================================================================
# `messaging.type` has no default — it must be set explicitly to one of
# amqp, kafka, pubsub, sns-sqs. There is no in-process/standalone transport;
# an unset or unrecognized type fails startup with an actionable error.
# messaging:
#   type: amqp
#   amqp:
#     url: amqp://localhost:5672
#     domain: customers  # Single domain (for aggregate mode)
#     # domains:         # Multiple domains (for projector/saga modes)
#     #   - customers
#     #   - orders
#
#   # Kafka:
#   # type: kafka
#   # kafka:
#   #   bootstrap_servers: localhost:9092
#   #   topic_prefix: angzarr
#   #   group_id: my-consumer
#   #   domains:
#   #     - customers
#   #     - orders

# =============================================================================
# Service Discovery & Endpoints
# =============================================================================

