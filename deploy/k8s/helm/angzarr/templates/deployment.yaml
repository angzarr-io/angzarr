                secretKeyRef:
                  name: {{ $.Values.messaging.amqp.existingSecret }}
                  key: {{ $.Values.messaging.amqp.secretKey }}
              {{- else }}
              value: {{ $.Values.messaging.amqp.url }}
              {{- end }}
            {{- end }}
            - name: ANGZARR_SUBSCRIPTIONS
              value: {{ include "angzarr.subscriptions" .topics | quote }}
            {{- include "angzarr.otel-env" (dict "root" $ "service" "saga" "domain" (.domain | trimPrefix "saga-")) | nindent 12 }}
          livenessProbe:
            grpc:
              port: {{ $.Values.service.aggregatePort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: {{ $.Values.service.aggregatePort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            {{- include "angzarr.sidecar-config-mount" $ | nindent 12 }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
      volumes:
        {{- include "angzarr.sidecar-config-volume" $ | nindent 8 }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

{{- /* Process Manager deployments */}}
{{- /* Naming convention: {name}-pm → hand-flow-pm */}}
{{- range .Values.applications.processManagers }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "angzarr.pm-service-name" (dict "name" .name) }}
  labels:
    {{- include "angzarr.labels" $ | nindent 4 }}
    app.kubernetes.io/component: process-manager
  {{- if $.Values.reloader.enabled }}
  annotations:
    reloader.stakater.com/auto: "true"
  {{- end }}
spec:
  {{- if not $.Values.autoscaling.enabled }}
  replicas: {{ $.Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "angzarr.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: process-manager
      angzarr.io/pm: {{ .name }}
  template:
    metadata:
      annotations:
        {{- include "angzarr.sidecar-config-checksum" $ | nindent 8 }}
        {{- if $.Values.reloader.enabled }}
        reloader.stakater.com/auto: "true"
        {{- end }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "angzarr.labels" $ | nindent 8 }}
        app.kubernetes.io/component: process-manager
        angzarr.io/pm: {{ .name }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "angzarr.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- if $.Values.messaging.amqp.enabled }}
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for RabbitMQ..."
              until nc -z {{ $.Values.messaging.amqp.host }} {{ $.Values.messaging.amqp.port | default 5672 }} 2>/dev/null; do sleep 2; done
              echo "RabbitMQ is ready"
        {{- end }}
      containers:
        # Main container: Process Manager application
        - name: {{ .name }}
          image: "{{ .image.repository }}:{{ .image.tag }}"
          imagePullPolicy: {{ .image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: grpc
              containerPort: {{ .port | default 50051 }}
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .port | default 50051 }}"
            - name: ANGZARR_HOST
              value: "localhost"
            - name: ANGZARR_PORT
              value: "{{ $.Values.service.aggregatePort }}"
            - name: ANGZARR_LOG
              value: {{ $.Values.logging.level }}
          resources:
            {{- if .resources }}
            {{- toYaml .resources | nindent 12 }}
            {{- else }}
            {{- toYaml $.Values.applicationResources | nindent 12 }}
            {{- end }}
          securityContext:
            {{- include "angzarr.containerSecurityContext" $ | nindent 12 }}

        # Sidecar: Angzarr process-manager sidecar
        - name: angzarr
          securityContext:
            {{- include "angzarr.containerSecurityContext" $ | nindent 12 }}
          image: "{{ $.Values.images.processManager.repository }}:{{ $.Values.images.processManager.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.images.processManager.pullPolicy }}
          ports:
            - name: coordinator
              containerPort: {{ $.Values.service.aggregatePort }}
              protocol: TCP
          env:
            - name: ANGZARR_LOG
              value: {{ $.Values.logging.level }}
            {{- include "angzarr.sidecar-config-env" $ | nindent 12 }}
            # Namespace and pod name for K8s service discovery and annotation writing
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # CASCADE coordinator port; the Service `grpc` port routes here
            - name: ANGZARR_COORDINATOR_PORT
              value: "{{ $.Values.service.aggregatePort }}"
            - name: ANGZARR__TARGET__ADDRESS
              value: "localhost:{{ .port | default 50051 }}"
            - name: ANGZARR__TARGET__DOMAIN
              value: {{ .domain | quote }}
            # Static endpoints for multi-domain command routing (business aggregates only)
            # PM state persistence is handled directly by the sidecar (no self-reference needed)
            # Uses new naming convention: {domain}-aggregate
            - name: ANGZARR_STATIC_ENDPOINTS
              value: "{{ include "angzarr.static-endpoints" (dict "root" $ "port" $.Values.service.aggregatePort) }}"
            # Storage: registry-style default backend (storage.backends.default)
            {{- if eq $.Values.storage.type "postgres" }}
            {{- if $.Values.storage.postgres.existingSecret }}
            # Registry-style storage config: core reads StorageRegistryConfig (a
            # named-backend map under storage.backends), not storage.postgres.uri.
            # Mirror the URI into the "default" backend that the event / snapshot
            # / position stores reference, else the coordinator falls back to its
            # localhost default and dies with PoolTimedOut.
            - name: ANGZARR__STORAGE__BACKENDS__DEFAULT__TYPE
              value: "postgres"
            - name: ANGZARR__STORAGE__BACKENDS__DEFAULT__URI
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.storage.postgres.existingSecret }}
                  key: uri
            {{- else }}
            - name: ANGZARR__STORAGE__BACKENDS__DEFAULT__TYPE
              value: "postgres"
            - name: ANGZARR__STORAGE__BACKENDS__DEFAULT__URI
              value: {{ $.Values.storage.postgres.uri | quote }}
            {{- end }}
            {{- end }}
            # Messaging configuration
            {{- if $.Values.messaging.amqp.enabled }}
            - name: ANGZARR__MESSAGING__TYPE
              value: "amqp"
            - name: ANGZARR__MESSAGING__AMQP__URL
              {{- if $.Values.messaging.amqp.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.messaging.amqp.existingSecret }}
                  key: {{ $.Values.messaging.amqp.secretKey }}
              {{- else }}
              value: {{ $.Values.messaging.amqp.url }}
              {{- end }}
            {{- end }}
            # Multi-domain subscriptions for process manager routing
            # Convert topics (table.*, hand.*) to subscriptions format (table;hand)
            - name: ANGZARR_SUBSCRIPTIONS
              value: {{ include "angzarr.subscriptions" .topics | quote }}
            {{- include "angzarr.otel-env" (dict "root" $ "service" "process-manager" "domain" .domain) | nindent 12 }}
          livenessProbe:
            grpc:
              port: {{ $.Values.service.aggregatePort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: {{ $.Values.service.aggregatePort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            {{- include "angzarr.sidecar-config-mount" $ | nindent 12 }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
      volumes:
        {{- include "angzarr.sidecar-config-volume" $ | nindent 8 }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
