# Istio mesh configuration for Angzarr

# Namespace where angzarr is deployed
angzarrNamespace: angzarr

# Ingress gateway configuration
gateway:
  # Name of the Istio ingress gateway deployment
  selector: istio-ingressgateway
  # Hosts to accept traffic for
  hosts:
    - "*"
  # Port configuration
  port: 80
  # TLS configuration (optional)
  tls:
    enabled: false
    mode: SIMPLE
    credentialName: ""

# Aggregate coordinator services ({domain}-aggregate, as the angzarr chart names them)
aggregates:
  # List of domains to route to
  domains:
    - name: order
      service: order-aggregate
      port: 1310
    - name: inventory
      service: inventory-aggregate
      port: 1310
    - name: fulfillment
      service: fulfillment-aggregate
      port: 1310

# EventStream service (none ships with the angzarr chart; enable when an
# external stream service is deployed)
stream:
  enabled: false
  service: angzarr-stream
  port: 1340

# mTLS configuration
mtls:
  enabled: true
  mode: STRICT  # STRICT or PERMISSIVE

# Traffic policy
trafficPolicy:
  connectionPool:
    http:
      h2UpgradePolicy: UPGRADE
      http2MaxRequests: 1000
    tcp:
      maxConnections: 100

  # Retry policy for gRPC
  retries:
    attempts: 3
    perTryTimeout: 5s
    retryOn: "connect-failure,refused-stream,unavailable,cancelled,resource-exhausted"

  # Request timeout
  timeout: 30s

  # Circuit breaker (outlier detection)
  outlierDetection:
    enabled: false
    consecutiveGatewayErrors: 5
    interval: 30s
    baseEjectionTime: 30s
    maxEjectionPercent: 50
