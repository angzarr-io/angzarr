# cargo-deny: what may enter the dependency graph. `just lint-deps` runs it.
#
# These crates are libraries used by applications under other
# licences, so a dependency's licence must be permissive; this file is the
# machine check that what enters is permissively licensed, comes from
# crates.io or a pinned, named git repo, and has no open RustSec advisory.

[graph]
# Every feature, judged, not only the default build.
all-features = true

[advisories]
version = 2
# RustSec advisories. An ignore needs the advisory id and why it does not
# apply here.
# RUSTSEC-2026-0542: humantime is unmaintained (it wraps chrono, also
# unmaintained); not a vulnerability. It reaches the graph only through
# cucumber, angzarr-codegen's dev-dependency (the spec tier's runner), and
# every cucumber release (0.21 to 0.23) depends on it. Delete this ignore
# when cucumber drops humantime.
ignore = [
  { id = "RUSTSEC-2026-0542", reason = "unmaintained, not vulnerable; only through cucumber, a test-only dev-dependency; no cucumber release avoids it" },
]

[licenses]
version = 2
# Copyleft is not on this list.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Not ignored: these crates are `publish = false`, and so are angzarr core's
# shared crates, whose licences are checked like any other's.
ignore = false

[bans]
# Duplicate versions warn, not fail: they are logged by the gate.
multiple-versions = "warn"
wildcards = "deny"
# A path dependency has no version; allowed for unpublished crates only.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  # angzarr core's shared crates: angzarr-diagnostic, angzarr-proto and,
  # for the tests, angzarr-presentation and angzarr-test-dir, pinned by one rev.
  "https://github.com/angzarr-io/angzarr",
  # angzarr-embedded-host-config, the host config's schema, pinned by rev.
  "https://github.com/angzarr-io/angzarr-embedded",
]
