name: CI

# angzarr core is a virtual workspace of the shared crates (crates/*). All
# logic lives in justfile recipes; these jobs only install tools and invoke
# them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  # Unbypassable guard against `--no-verify` / `LEFTHOOK=0` locally. Mirrors
  # the parent-side check that lefthook runs on pre-commit. Pointer-only
  # bumps pass; dirty submodule working trees fail.
  submodules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Verify submodules are clean
        run: just check-submodules-clean

  # Every check of every shared crate (`just check-shared-crates`: the
  # submodule cannot clash with them, then each crate's fmt-check, build,
  # lint, test and, where it has them, wasm and wasm-test), on the runner
  # itself: the crates need protoc, the wasm32 target,
  # wasm-bindgen-test-runner and node.
  shared-crates:
    name: Shared crates
    runs-on: ubuntu-latest
    needs: [submodules]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust (stable, wasm32, rustfmt, clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default stable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen*
            target
          key: ${{ runner.os }}-shared-crates-${{ hashFiles('Cargo.lock') }}

      - name: wasm-bindgen-test-runner
        run: just -f crates/angzarr-ports/justfile tools

      - name: Every shared crate's checks
        run: just check-shared-crates

  # What may enter the shared crates' dependency graph (deny.toml).
  lint-deps:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    needs: [submodules]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: cargo-deny
        run: just lint-deps

  # The spec's protos, as the angzarr-project submodule pins them.
  protos:
    name: Protos (buf)
    runs-on: ubuntu-latest
    needs: [submodules]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buf lint
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/angzarr-project/proto \
            ghcr.io/angzarr-io/angzarr-rust:latest \
            buf lint

      - name: Buf breaking changes
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/angzarr-project/proto \
            ghcr.io/angzarr-io/angzarr-rust:latest \
            buf breaking --against 'https://github.com/${{ github.repository }}.git#branch=main'
        continue-on-error: true
