# The mutation full pass, weekly and by hand: one job per group of crates, each
# `just mutants-all` restricted to that group by MUTANTS_ONLY, judged by the
# justfile's mutation_thresholds, with the group's family config
# (.cargo/mutants.<family>.toml, selected by `mutation_families`). The whole
# workspace in one job does not fit GitHub's 360 minutes; core's crates were a
# matrix of one job each already. No git hook runs mutation. angzarr-proto and
# the other proto crates are generated code and are not mutated.
#
# Every action is pinned to a commit, its release in the comment; every tool
# to a version.

name: mutation

on:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      group:
        description: 'Run only the matrix entry with this name (empty: all)'
        required: false
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  TOOLS: just@1.40.0,cargo-mutants@26.2.0,cargo-nextest@0.9.146
  MOLD_VERSION: '2.42.1'

jobs:
  # A job's `if` cannot read the matrix, so the matrix is chosen here: every
  # group, or the one named by the `group` input.
  plan:
    name: groups
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          GROUP: ${{ inputs.group }}
          GROUP_TABLE: |
            [
              {"name": "ports", "crates": "angzarr-ports"},
              {"name": "bus", "crates": "angzarr-bus"},
              {"name": "yaml", "crates": "angzarr-yaml"},
              {"name": "store-transfer", "crates": "angzarr-store-transfer"},
              {"name": "coordinator-base", "crates": "angzarr-coordinator-base"},
              {"name": "reads", "crates": "angzarr-reads"},
              {"name": "coordinator", "crates": "angzarr-coordinator"},
              {"name": "coordinator-grpc", "crates": "angzarr-coordinator-grpc"},
              {"name": "router", "crates": "angzarr-router"},
              {"name": "build", "crates": "angzarr-build angzarr-codegen"},
              {"name": "embedded", "crates": "angzarr-embedded angzarr-embedded-catalog-check angzarr-embedded-conformance angzarr-embedded-host angzarr-embedded-host-config angzarr-embedded-macros angzarr-embedded-runner angzarr-store-sqlite"},
              {"name": "sqlite-store-opener", "crates": "sqlite-store-opener"}
            ]
        run: |
          matrix=$(jq -c --arg group "$GROUP" '{include: map(select($group == "" or .name == $group))}' <<< "$GROUP_TABLE")
          echo "$matrix"
          [ "$(jq '.include | length' <<< "$matrix")" -gt 0 ] || { echo "no group named '$GROUP'" >&2; exit 1; }
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  mutants:
    name: mutation (${{ matrix.name }})
    needs: [plan]
    runs-on: ubuntu-24.04
    # GitHub's cap for a hosted job; let the pass finish rather than cancel it.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install mold
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        with:
          mold-version: ${{ env.MOLD_VERSION }}
          make-default: false
      - uses: ctxloom/ci/.github/actions/setup-protoc@fa01764571615bd3174313e84631bdd5c13a02e6 # main 2026-11-12, protoc 3.21.12 by checksum
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: ${{ env.TOOLS }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: just mutants-all
        env:
          MUTANTS_ONLY: ${{ matrix.crates }}
      - name: The gate's log and surviving mutants
        if: always()
        run: |
          shopt -s nullglob
          for f in target/logs/mutants-all.log target/logs/mutants-all/mutants.out/missed.txt; do
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done
