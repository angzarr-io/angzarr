# cargo-deny for the whole angzarr workspace (the union of the five former files:
# embedded's advisory ignores, core's ISC; no git source is allowed any more,
# the family crates are path dependencies). `just lint-deps` runs it.

[graph]
# Every feature, judged, not only the default build.
all-features = true

[advisories]
version = 2
# RustSec advisories. An ignore needs the advisory id and why it does not
# apply here.
# RUSTSEC-2026-0459: the SQLite the store bundles (libsqlite3-sys 0.30.1)
# can return uninitialized page-cache memory when a process opens a database
# together with a `-wal` sibling of a different page size. The exposure needs
# a database plus -wal sibling written by a less trusted party; the databases
# here are the user's own. Delete this ignore when the SQLite store moves to
# libsqlite3-sys >= 0.39.
# RUSTSEC-2026-0542: humantime is unmaintained (it wraps chrono, also
# unmaintained); not a vulnerability. It reaches the graph only through
# cucumber, the conformance crate's dev-dependency (the features' runner),
# and every cucumber release (0.21 to 0.23) depends on it. Delete this
# ignore when cucumber drops humantime.
# RUSTSEC-2026-0543: chrono is unmaintained (all versions); not a
# vulnerability. It reaches the graph only through the duckdb crate, which
# depends on arrow and chrono unconditionally (angzarr-store-duckdb).
# Delete this ignore when duckdb drops chrono or chrono is maintained again.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "unmaintained, not vulnerable; only through the duckdb crate (arrow, chrono), which cannot be built without them" },
  { id = "RUSTSEC-2026-0459", reason = "bundled SQLite via the store; databases are the user's own; upstream bump pending" },
  { id = "RUSTSEC-2026-0542", reason = "unmaintained, not vulnerable; only through cucumber, a test-only dev-dependency; no cucumber release avoids it" },
]

[licenses]
version = 2
# Third-party dependencies must be permissive: angzarr's runtime exception and its
# permissive crates are linked by applications under other licences, and a
# copyleft dependency would impose its terms on them. Copyleft is not on this
# list. angzarr's own AGPL crates are allowed one by one, by the exceptions at
# the end of this file, which scripts/licences.sh writes from licences.tsv.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9
# Any third-party copyleft crate fails here.

[licenses.private]
# Not ignored: angzarr-embedded's own crates are `publish = false`, and so are
# angzarr-proto and angzarr-ports, whose licences are checked like any
# other's.
ignore = false

[bans]
# Duplicate versions warn, not fail: they are logged by the gate, and most
# come from upstream trees (sqlx) that angzarr-embedded does not control.
multiple-versions = "warn"
wildcards = "deny"
# A path dependency has no version; allowed for unpublished crates only.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# tiny-keccak is CC0-1.0, a public-domain dedication with no conditions: it is
# permissive in effect. It reaches the graph only through the duckdb crate
# (arrow, ahash, const-random). Allowed for that crate alone.
[[licenses.exceptions]]
crate = "tiny-keccak"
allow = ["CC0-1.0"]

# BEGIN licences.sh (generated from licences.tsv)
[[licenses.exceptions]]
crate = "angzarr-coordinator"
allow = ["AGPL-3.0-only WITH AdditionRef-angzarr-grpc-api-permission"]

