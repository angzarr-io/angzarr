# cargo-mutants, the default family: the crates of no family in the justfile's
# `mutation_families` (core's, router's and build's). `just mutants-all`,
# `mutants-push` and `mutants-staged` pass each family its own config
# (.cargo/mutants.embedded.toml).
#
# Test code is not mutated: a test is what judges a mutant. The glob names
# every test file, whatever cfg includes it.
exclude_globs = ["*.test.rs"]

# Each mutant runs only its own crate's tests (cargo-mutants' default). The
# thresholds judge whether a crate tests itself; a dependent's tests killing
# a mutant would credit the crate with coverage it does not have.
test_workspace = false

# Only genuinely equivalent mutants belong here: ones no input can tell apart
# from the original, each matched alone by its description, with its argument.
exclude_re = []
