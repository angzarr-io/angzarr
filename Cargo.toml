[workspace]
members = [
    "crates/trivial-delegation",
    "xtask",
]
# sererr is a submodule with its own cargo workspace. Cargo's auto-discovery
# would otherwise treat sererr/packages/rust/* as members of THIS workspace.
# `exclude` removes them from membership but does NOT stop cargo's path-dep
# `.workspace = true` inheritance lookup from walking up and claiming this
# workspace as the root (a known cargo limitation around nested workspaces).
# The `[workspace.package]` block below mirrors sererr's own at
# sererr/packages/rust/Cargo.toml so that the inheritance resolves to the
# right values even when claimed by the wrong workspace. Sync if sererr's
# upstream values change.
exclude = ["sererr", "angzarr-project"]
resolver = "2"

# Mirrored from sererr/packages/rust/Cargo.toml's [workspace.package].
# Only consumed by sererr's path-dep inner crates' `<field>.workspace = true`
# inheritance. Has no effect on the angzarr crate itself (which sets its
# package fields explicitly in [package] below).
[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["sererr contributors"]
license = "MIT OR BSD-3-Clause"
homepage = "https://sererr.fyi"
repository = "https://github.com/sererr/sererr"
keywords = ["error", "stack-trace", "sentry", "backtrace", "diagnostics"]
categories = ["development-tools::debugging"]

# Mirrored from sererr/packages/rust/Cargo.toml's [workspace.dependencies].
# Consumed only by sererr's path-dep inner crates when they declare
# `<dep> = { workspace = true }`. Paths are rewritten to be relative to
# THIS Cargo.toml (sererr/packages/rust/<crate>) because cargo resolves
# them against the claiming workspace root.
[workspace.dependencies]
backtrace = "0.3"
prost = "0.14"
sererr = { version = "0.1", path = "sererr/packages/rust/sererr" }
sererr-proto = { version = "0.1", path = "sererr/packages/rust/sererr-proto" }

[package]
name = "angzarr"
version = "0.5.1"
edition = "2021"
authors = ["Benjamin Abbitt"]
description = "Schema-first CQRS/ES framework for polyglot client logic"
license = "AGPL-3.0-only"

[features]
# Default: otel for observability
default = ["otel"]

# =============================================================================
# Deployment Profiles (opinionated stacks)
# =============================================================================
# Note: sqlite is always compiled (no feature gate) for local orchestration support.
# k8s: Generic Kubernetes with Postgres and RabbitMQ. (The GCP and AWS
# profiles are not yet ported to the latest proto; restore them from
# 16db7169 as they are ported.)
k8s = ["postgres", "amqp", "otel", "dep:kube", "dep:k8s-openapi"]

# =============================================================================
# Storage Backends
# =============================================================================
# SQLite is always compiled; Postgres adds sqlx's Postgres driver.
postgres = ["sqlx/postgres"]

# =============================================================================
# Messaging Backends
# =============================================================================
amqp = ["dep:lapin", "dep:deadpool-lapin"]

# =============================================================================
# Observability & Utilities
# =============================================================================
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-appender-tracing", "dep:tracing-opentelemetry"]
# Test utilities for integration tests
test-utils = []
# Enable #[coverage(off)] attribute on nightly (for trivial_delegation)
coverage_nightly = []

# =============================================================================
# All Features (for CI/development)
# =============================================================================
# Note: sqlite is always compiled, not listed here
full = ["k8s"]
full-musl = ["k8s"]

[dependencies]
# gRPC
tonic = { version = "0.14", features = ["tls-ring", "transport"] }
tonic-health = "0.14"
tonic-reflection = "0.14"
prost = "0.14"
prost-types = "0.14"
tonic-prost = "0.14.5"
tokio-stream = { version = "0.1", features = ["net"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
http = "1"
http-body = "1"
bytes = "1"
hyper-util = { version = "0.1", features = ["tokio"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Storage - Query builder approach (like jOOQ)
# SQLite is always compiled for local orchestration support
sea-query = "0.32"
sea-query-binder = { version = "0.7", features = ["sqlx-sqlite"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

# Retry with backoff
backon = "1"

# HTTP client for external service calls
# Using rustls-tls for musl static build compatibility (no OpenSSL dependency)
# ring provides the crypto backend for rustls
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Core utilities
uuid = { version = "1", features = ["v4", "v5", "v7"] }
async-trait = "0.1"
thiserror = "2"
futures = "0.3"
chrono = "0.4"
hex = "0.4"
serde_json = "1"
inventory = "0.3"
regex = "1"
semver = "1"

# Protobuf reflection (for logging projector)
prost-reflect = { version = "0.16", features = ["serde"] }

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OpenTelemetry (optional, feature-gated)
opentelemetry = { version = "0.31", optional = true }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "metrics", "logs"], optional = true }
opentelemetry-appender-tracing = { version = "0.31", optional = true }
tracing-opentelemetry = { version = "0.32", optional = true }

# Configuration
config = "0.14"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
base64 = "0.22"

# AMQP/RabbitMQ (optional)
lapin = { version = "2", optional = true }
deadpool-lapin = { version = "0.12", optional = true }

# Kubernetes API (for gateway service discovery) - optional, k8s feature only
kube = { version = "0.98", features = ["runtime", "client"], optional = true }
k8s-openapi = { version = "0.24", features = ["v1_29"], optional = true }

sha2 = "0.10.9"
mutants = "0.0.4"
trivial-delegation = { path = "crates/trivial-delegation" }

# The io.angzarr.v1 wire types: angzarr-project's angzarr-proto crate, at the
# submodule's commit (the submodule pin is the version pin). build.rs
# generates only the service stubs it lacks, extern-pathed onto these types.
angzarr-proto = { path = "angzarr-project/rust/angzarr-proto" }

# Structured stack-trace + error-chain capture.
#   - `sererr` provides plain Rust types (no proto dep) used as the
#     in-process representation in `src/dlq/mod.rs`.
#   - `sererr-proto` converts them to the prost `sererr.v1.CapturedError`;
#     the dead-letter wire type is angzarr-proto's copy of the same message,
#     reached by re-encoding (see `src/dlq/mod.rs`).
sererr = { path = "sererr/packages/rust/sererr" }
sererr-proto = { path = "sererr/packages/rust/sererr-proto" }

# Unix process management (signals, child-process lifecycle).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "fs", "user"] }

[lints.rust]
# coverage_nightly is a custom cfg used for conditional #[coverage(off)] on nightly
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[build-dependencies]
heck = "0.5"
tonic-prost-build = "0.14"
prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"

[[bin]]
name = "angzarr-aggregate"
path = "src/bin/angzarr_aggregate.rs"

[[bin]]
name = "angzarr-projector"
path = "src/bin/angzarr_projector.rs"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
cucumber = "0.21"
futures = "0.3"
serial_test = "3"
testcontainers = "0.27"
hex = "0.4"
rand = "0.9"

# =============================================================================
# Contract Test Binaries
# =============================================================================
# These tests verify that storage and bus implementations correctly fulfill
# their trait contracts. Each backend gets its own test binary with the
# required feature flag, ensuring:
#   1. Tests only compile when the backend is available
#   2. Clear error messages when running without required features
#   3. Isolated test runs per backend for CI parallelization
#
# Storage tests verify: EventStore, SnapshotStore, PositionStore traits
# Bus tests verify: EventBus trait (publish, subscribe, ack/nack, DLQ)
# =============================================================================

# --- Bus Contract Tests ---

[[test]]
name = "bus_amqp"
# RabbitMQ/AMQP as event bus. Testing ensures exchange/queue bindings,
# message routing, acknowledgment, and dead-letter queue handling work correctly.
required-features = ["amqp", "test-utils"]

# --- Blackjack stage-1 wiring over real transports ---
# gRPC Handle -> business process -> SQLite -> RabbitMQ -> projector
# coordinator -> projection process (testcontainers RabbitMQ).
[[test]]
name = "mvp_round_trip"
required-features = ["amqp", "test-utils"]

# --- Coordinator-contract scenarios ---
# Cucumber-rs harness against angzarr-project/features/coordinator-contract:
# the scenarios the aggregate coordinator owns, bound by scenario id and run
# in process (tests/coordinator_contract.rs).
[[test]]
name = "coordinator_contract"
harness = false
required-features = ["test-utils"]

# === Build Profiles ===

# Dev profile - optimized for size to keep disk usage sane
[profile.dev]
opt-level = "z"
debug = 0
strip = true
incremental = true

# Container dev profile - optimized for size, no incremental
# Usage: cargo build --profile container-dev
[profile.container-dev]
inherits = "dev"
incremental = false

# Test profile - optimized for size
# Usage: cargo test (automatically used)
[profile.test]
opt-level = "z"
debug = 0
strip = true
incremental = true

# Release profile - slow compilation, fast runtime (for production)
[profile.release]
opt-level = "z"     # Optimize for size
lto = "fat"         # Maximum link-time optimization
codegen-units = 1   # Single codegen unit for best optimization
strip = true        # Strip symbols for smaller binaries
panic = "abort"     # Abort on panic (smaller binaries, no unwinding)

# Production profile - maximum optimization with all features
# Usage: cargo build --profile production --features full
[profile.production]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

