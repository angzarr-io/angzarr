[package]
name = "angzarr-diagnostic"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0 OR BSD-3-Clause"
description = "Localizable errors: a stable code and named data on every error, rendered where it is shown, from a Fluent catalog keyed by the code"
repository = "https://github.com/angzarr-io/angzarr"
publish = false

# A member of angzarr-core's workspace, with every package field set here:
# the workspace declares no [workspace.package], so nothing is inherited.

# Deliberately zero dependencies, and nothing from any program that uses it.
[dependencies]

# The shared crates' lints: the workspace's (the root Cargo.toml).
[lints]
workspace = true
