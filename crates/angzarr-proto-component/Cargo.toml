[package]
name = "angzarr-proto-component"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR BSD-3-Clause"
description = "angzarr's component contract, io.angzarr.component.v1: the handler-side services (CommandHandlerService, PolicyService, ProjectorService, UpcasterService, ComponentService) as tonic client and server stubs on the handler layer's messages"
repository = "https://github.com/angzarr-io/angzarr"
publish = false

# A member of angzarr-core's workspace, with every package field set here:
# the workspace declares no [workspace.package], so nothing is inherited.

[dependencies]
# Core's messages (io.angzarr.v1), which every service here takes and
# answers: extern-pathed, never generated twice (decision 14.64).
angzarr-proto = { path = "../angzarr-proto" }
# The handler layer's messages (io.angzarr.handler.v1), which the services
# take and answer (decision 14.78): extern-pathed, never generated twice.
angzarr-proto-handler = { path = "../angzarr-proto-handler" }
bytes = "1"
prost = "0.14"
prost-types = "0.14"
# The services' stubs, always: they are this crate's reason to exist, so a
# feature that turned them off would leave it empty. tonic's codegen only
# (no transport, so no runtime or connector is chosen for the caller) and
# its prost codec.
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
tonic-prost = "0.14"

[build-dependencies]
prost-build = "0.14"
# No default features: neither tonic-build's transport (build_transport(false))
# nor prost-build's markdown clean-up of doc comments.
tonic-prost-build = { version = "0.14", default-features = false }

# The shared crates' lints: the workspace's (the root Cargo.toml).
[lints]
workspace = true
