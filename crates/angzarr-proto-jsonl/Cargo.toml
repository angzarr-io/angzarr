[package]
name = "angzarr-proto-jsonl"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0 OR BSD-3-Clause"
description = "Protobuf messages as JSON Lines: canonical proto3 JSON, one message per line, written and read against descriptors the caller supplies"
repository = "https://github.com/angzarr-io/angzarr"
publish = false

# A member of angzarr-core's workspace, with every package field set here:
# the workspace declares no [workspace.package], so nothing is inherited.

# A pure codec: no I/O of its own, no clock, no globals, nothing from any
# program that uses it.
[dependencies]
angzarr-diagnostic = { path = "../angzarr-diagnostic" }
# DynamicMessage and its canonical proto3 JSON mapping (the `serde` feature):
# 64-bit integers as strings, bytes as base64, enums by name, the well-known
# types per the spec. The same version angzarr-embedded and its dependents lock.
prost-reflect = { version = "0.16.5", features = ["serde"] }
# The JSON text reader and writer prost-reflect's mapping is driven through.
serde_json = "1.0.149"
# The Serialize trait of the key-sorting writer (src/lib.rs), no derive.
serde = { version = "1.0.228", default-features = false, features = ["std"] }

[dev-dependencies]
# The tests build their descriptors by hand (a FileDescriptorProto), so no
# protoc and no .proto compiler is needed.
prost = "0.14"
prost-types = "0.14"

# The build writes the catalog's source under the crate's name
# (angzarr_diagnostic::build): no catalog spells its crate's name.
[build-dependencies]
angzarr-diagnostic = { path = "../angzarr-diagnostic", features = ["build"] }

# The shared crates' lints: the workspace's (the root Cargo.toml).
[lints]
workspace = true
