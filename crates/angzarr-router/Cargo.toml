[package]
publish = false
name = "angzarr-router"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "The shared angzarr client router: dispatch/rebuild semantics, implemented once"

[dependencies]
angzarr-proto = { workspace = true }
angzarr-proto-handler = { workspace = true }
angzarr-ports = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tracing = { workspace = true }

# The wasm32 run of tests/wasm.rs (components that are not Send), under
# node with wasm-bindgen-test-runner (`just wasm`). The same pin as
# angzarr-ports'; the runner's version must match the lock's wasm-bindgen.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"

[lints]
workspace = true
