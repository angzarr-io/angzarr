# The end-to-end fixture of angzarr-build's tests/local.rs for the shapes
# fixtures: three packages (one of types alone), angzarr's UUID and id
# newtypes, Duration, oneofs, nested types and anchors. Their wire
# types and domain layers are generated by its build.rs; its tests convert
# every domain type to its wire type and back (property tests). A
# workspace of its own, outside angzarr-build's. Its Cargo.lock is a build
# artifact, ignored.
[package]
name = "shapes-app"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# The family's pins, as the other fixtures': angzarr-embedded, and the
# angzarr core it builds on, whose angzarr-proto the wire types take
# angzarr's UUID from.
[dependencies]
angzarr-embedded = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "bce1ff2ed813c72b869bbbfcdb7ba9b426e47812" }
angzarr-proto = { git = "https://github.com/angzarr-io/angzarr", rev = "3535a54a25e95b57dabbcbaea5f3603b1ac13f5c" }
prost = "0.14"
# google.protobuf.Duration, which the wire types and the domain layer both
# hold as prost's type.
prost-types = "0.14"

# Round trips over generated values.
[dev-dependencies]
proptest = "1.12"

[build-dependencies]
angzarr-build = { path = "../../.." }
