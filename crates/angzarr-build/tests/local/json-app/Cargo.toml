# The end-to-end fixture of angzarr-build's tests/local.rs for the generated
# JSON: the json fixture's wire types and their proto3 JSON (angzarr-json.rs),
# generated by its build.rs. Its tests hold the JSON to golden files, round
# trip it (property tests), and cross-check it with prost-reflect's
# canonical mapping. A workspace of its own, outside angzarr-build's. Its
# Cargo.lock is a build artifact, ignored.
[package]
name = "json-app"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# angzarr core at the family's pin: its angzarr-proto is the wire types'
# UUID.
[dependencies]
angzarr-proto = { git = "https://github.com/angzarr-io/angzarr", rev = "434ccc0a8ae614e42c7b88af81ab32b5a4de8686" }
prost = "0.14"
prost-types = "0.14"
# The generated JSON's Serialize and Deserialize.
serde = "1"

[dev-dependencies]
# The text the tests read and write; `float_roundtrip`, so a double reads
# back exact (the generated JSON writes each by its shortest exact text).
serde_json = { version = "1.0.149", features = ["float_roundtrip"] }
# The canonical proto3 JSON mapping the generated one is cross-checked with,
# at the version angzarr core locks.
prost-reflect = { version = "0.16.5", features = ["serde"] }
# Round trips over generated values.
proptest = "1.12"

[build-dependencies]
angzarr-build = { path = "../../.." }
