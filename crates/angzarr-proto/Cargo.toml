[package]
name = "angzarr-proto"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR BSD-3-Clause"
description = "prost types for angzarr's core wire contract: every io.angzarr.v1 message and core reason key, prost only, a dependency leaf that builds for wasm32"
repository = "https://github.com/angzarr-io/angzarr"
publish = false

# A member of angzarr-core's workspace, with every package field set here:
# the workspace declares no [workspace.package], so nothing is inherited.

[dependencies]
# `bytes` fields map to bytes::Bytes (cheap clones, Hash/Eq); wasm32-safe.
bytes = "1"
prost = "0.14"
prost-types = "0.14"
# UUID text form and v5 derivation for the generated `UUID` type. No default
# features (no std, no RNG), so it stays wasm32-safe; `v5` adds sha1_smol.
uuid = { version = "1", default-features = false, features = ["v5"] }

# No features, and no tonic (decision 1.12, restored by 14.64): the services
# are angzarr-proto-component's and the transports' crates', beside this one.
[build-dependencies]
prost-build = "0.14"

# The shared crates' lints: the workspace's (the root Cargo.toml).
[lints]
workspace = true
