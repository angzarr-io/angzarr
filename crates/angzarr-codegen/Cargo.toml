[package]
name = "angzarr-codegen"
version = "0.1.0"
description = "angzarr's generator core: descriptors in, generated source out. Pure: no I/O."
edition = "2024"
authors = ["Benjamin Abbitt"]
# Apache-2.0 OR BSD-3-Clause: angzarr-build, which application build scripts
# depend on, depends on this crate. See LICENSE-APACHE and LICENSE-BSD beside
# it.
license = "Apache-2.0 OR BSD-3-Clause"
publish.workspace = true
rust-version = "1.96"

[dependencies]
coded-diagnostic.workspace = true
# The ComponentDescriptor a component is described by (types.proto), built
# and encoded here: the descriptor set holds options.proto, not types.proto.
angzarr-proto.workspace = true
prettyplease = "0.3.0"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
prost-reflect = "0.16"
quote = "1.0.47"
# The host config's schema (angzarr.yaml), the one angzarr-embedded-host
# runs, to lint it, seed it and derive an application from it.
angzarr-embedded-host-config.workspace = true
serde.workspace = true
syn = { version = "3.0.9", features = ["full"] }
# An application's manifest (Cargo.toml), read for its domain crate.
toml = "0.9"

[dev-dependencies]
angzarr-project.workspace = true
presentation.workspace = true
test-dir.workspace = true
# Runs the spec's codegen tier (tests/spec.rs): angzarr-router's runner,
# at the version its conformance crate runs its features with.
cucumber = "0.21"
prost = "0.14"
# The generated JSON's runtime (src/json/runtime.rs), compiled by its own
# tests as a wire crate compiles it: it names prost's well-known types.
prost-types = "0.14"
# The runtime's serde entry points, written and read as JSON text.
serde_json = "1.0.149"

# The build writes the catalog's source under the crate's name
# (coded_diagnostic::build): no catalog spells its crate's name.
[build-dependencies]
coded-diagnostic = { workspace = true, features = ["build"] }

[lints]
workspace = true
