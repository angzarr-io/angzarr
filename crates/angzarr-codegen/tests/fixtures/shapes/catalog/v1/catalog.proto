// A component whose state is its anchor, and a type another package's
// component holds (shapes.order.v1 holds its Item).
syntax = "proto3";
package shapes.catalog.v1;

import "io/angzarr/v1/options.proto";
import "io/angzarr/v1/types.proto";
import "io/angzarr/codegen/v1/codegen.proto";
import "shapes/common/v1/common.proto";

message CatalogState {
  option (io.angzarr.v1.component) = {
    component_name: "catalog"
    aggregate: {domain: "catalog"}
  };

  repeated Item items = 1;
  map<string, uint32> stock = 2;
}

message Item {
  string sku = 1;
  shapes.common.v1.Money price = 2;
  optional string note = 3;
}

message ListItem {
  option (io.angzarr.v1.command) = {
    component: "shapes.catalog.v1.CatalogState"
    emits: ["shapes.catalog.v1.ItemListed"]
    refuses: "shapes.catalog.v1.ItemRefused"
  };

  Item item = 1;
  io.angzarr.v1.UUID listing = 2 [(io.angzarr.codegen.v1.field) = {id_type: "ListingId"}];
}

message ItemListed {
  option (io.angzarr.v1.event) = {component: "shapes.catalog.v1.CatalogState"};

  Item item = 1;
  io.angzarr.v1.UUID listing = 2 [(io.angzarr.codegen.v1.field) = {id_type: "ListingId"}];
}

message ItemRefused {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_ALREADY_EXISTS;

  string kind = 1;
  // A oneof's arms are not the refusal's args: only `kind` is.
  oneof clash {
    string sku = 2;
    uint32 count = 3;
  }
}
